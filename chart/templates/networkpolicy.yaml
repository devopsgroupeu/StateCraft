{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "statecraft.fullname" . }}
  labels:
    {{- include "statecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "statecraft.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.ingress .Values.metrics.enabled }}
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.metrics.enabled }}
    {{- include "statecraft.metricsScrapeRule" . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
