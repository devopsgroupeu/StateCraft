apiVersion: v1
kind: Service
metadata:
  name: {{ include "statecraft.fullname" . }}
  labels:
    {{- include "statecraft.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- /* An externally reachable Service type would expose the unauthenticated
    metrics port; metrics-service.yaml serves it in-cluster instead. */}}
    {{- if and .Values.metrics.enabled (eq .Values.service.type "ClusterIP") }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "statecraft.selectorLabels" . | nindent 4 }}
