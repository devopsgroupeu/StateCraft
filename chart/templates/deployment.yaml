{{- /* The API refuses to start without a token, so a release rendered without
     one would only crashloop. Fail at render instead (OP-270). The app reads
     STATECRAFT_AUTH_DISABLED as true only when it is the string "true". */ -}}
{{- $hasToken := or .Values.envFrom (get .Values.app.env "SERVICE_TOKEN") (eq (lower (toString (get .Values.app.env "STATECRAFT_AUTH_DISABLED"))) "true") -}}
{{- range .Values.extraEnv }}
{{- if eq .name "SERVICE_TOKEN" }}{{ $hasToken = true }}{{ end }}
{{- if and (eq .name "STATECRAFT_AUTH_DISABLED") (eq (lower (toString .value)) "true") }}{{ $hasToken = true }}{{ end }}
{{- end }}
{{- if not $hasToken }}
{{- fail "StateCraft needs a service token: add SERVICE_TOKEN to extraEnv (valueFrom a Secret), or provide it via envFrom; for local development only, set STATECRAFT_AUTH_DISABLED=true" }}
{{- end }}
{{- if and .Values.metrics.enabled (eq (int .Values.metrics.port) (int .Values.service.targetPort)) }}
{{- fail "metrics.port must differ from service.targetPort: the metrics listener and the API cannot share a port" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "statecraft.fullname" . }}
  labels:
    {{- include "statecraft.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "statecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "statecraft.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "statecraft.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          {{- end }}
          env:
            {{- if and (not .Values.aws.useIRSA) (or .Values.aws.existingSecret .Values.aws.credentials.accessKeyId) }}
            # AWS credentials from secret (when not using IRSA and secret exists)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "statecraft.secretName" . }}
                  key: {{ .Values.aws.secretKeys.accessKeyId }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "statecraft.secretName" . }}
                  key: {{ .Values.aws.secretKeys.secretAccessKey }}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "statecraft.secretName" . }}
                  key: {{ .Values.aws.secretKeys.defaultRegion }}
            {{- end }}
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # Set from the chart, and last so it wins over a duplicate above, so
            # the port the app binds always matches the metrics container port.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
