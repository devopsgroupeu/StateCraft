version: 2

# Prefixes follow .releaserc.json: build(deps) cuts a patch release, ci and chore do not.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        update-types: [minor, patch]

  # package.json only holds the semantic-release toolchain, so its updates never cut a release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Until OpenPrime-280: preset 10 needs conventional-changelog-writer 9, which only the
    # semantic-release 26 line ships; merging it breaks the next release's notes.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      release-tooling:
        update-types: [minor, patch]
